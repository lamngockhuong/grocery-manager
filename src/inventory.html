<div class="container">
  <h5>Quản Lý Tồn Kho</h5>

  <!-- Summary cards -->
  <div class="row">
    <div class="col s6 m3">
      <div class="card-panel center-align stat-card">
        <h4 id="inv-total">0</h4>
        <p>Tổng mặt hàng</p>
      </div>
    </div>
    <div class="col s6 m3">
      <div class="card-panel red lighten-4 center-align stat-card">
        <h4 id="inv-low">0</h4>
        <p>Sắp hết hàng</p>
      </div>
    </div>
  </div>

  <!-- Filter -->
  <label>
    <input type="checkbox" id="low-stock-filter" onchange="Inventory.render()">
    <span>Chỉ hiện sắp hết hàng</span>
  </label>

  <!-- Inventory table -->
  <div class="table-wrapper">
    <table class="striped responsive-table">
      <thead>
        <tr>
          <th>Sản phẩm</th>
          <th>Tồn kho</th>
          <th>Tối thiểu</th>
          <th>Nhập hàng cuối</th>
          <th class="admin-only">Thao tác</th>
        </tr>
      </thead>
      <tbody id="inventory-tbody"></tbody>
    </table>
  </div>

  <!-- Restock Modal -->
  <div id="restock-modal" class="modal">
    <div class="modal-content">
      <h5>Nhập thêm hàng</h5>
      <input type="hidden" id="restock-product-id">
      <p id="restock-product-name" class="flow-text"></p>
      <div class="input-field">
        <input id="restock-quantity" type="number" min="1">
        <label for="restock-quantity">Số lượng nhập thêm</label>
      </div>
    </div>
    <div class="modal-footer">
      <a class="modal-close btn-flat">Huỷ</a>
      <button class="btn blue waves-effect" onclick="Inventory.doRestock()">Nhập hàng</button>
    </div>
  </div>

  <!-- Min Stock Modal -->
  <div id="minstock-modal" class="modal">
    <div class="modal-content">
      <h5>Đặt mức tối thiểu</h5>
      <input type="hidden" id="minstock-product-id">
      <p id="minstock-product-name" class="flow-text"></p>
      <div class="input-field">
        <input id="minstock-value" type="number" min="0">
        <label for="minstock-value">Mức tồn kho tối thiểu</label>
      </div>
    </div>
    <div class="modal-footer">
      <a class="modal-close btn-flat">Huỷ</a>
      <button class="btn blue waves-effect" onclick="Inventory.saveMinStock()">Lưu</button>
    </div>
  </div>
</div>

<script>
var Inventory = {
  loaded: false,

  init: function() {
    var self = this;
    if (!this.loaded) {
      showLoading('inventory-tbody');
      api.call('apiGetInventory').then(function(data) {
        state.inventory = data || [];
        self.loaded = true;
        self.render();
      }).catch(function(e) {
        showToast('Lỗi tải tồn kho: ' + e.message, 'red');
      });
    } else {
      this.render();
    }
  },

  render: function() {
    var items = state.inventory;
    var lowFilter = document.getElementById('low-stock-filter');
    if (lowFilter && lowFilter.checked) {
      items = items.filter(function(i) { return i.quantity < i.min_stock; });
    }

    document.getElementById('inv-total').textContent = state.inventory.length;
    document.getElementById('inv-low').textContent =
      state.inventory.filter(function(i) { return i.quantity < i.min_stock; }).length;

    if (items.length === 0) {
      showEmptyState('inventory-tbody', 'Không có dữ liệu tồn kho');
      return;
    }

    var tbody = document.getElementById('inventory-tbody');
    tbody.innerHTML = items.map(function(i) {
      var isLow = i.quantity < i.min_stock;
      return '<tr class="' + (isLow ? 'red lighten-5' : '') + '">' +
        '<td>' + escapeHtml(i.product_name) + '</td>' +
        '<td>' + i.quantity + (isLow ? ' <i class="material-icons tiny red-text">warning</i>' : '') + '</td>' +
        '<td>' + i.min_stock + '</td>' +
        '<td>' + formatDate(i.last_restock) + '</td>' +
        '<td class="admin-only">' +
          '<a onclick="Inventory.showRestock(\'' + i.product_id + '\')" class="btn-small blue waves-effect">Nhập hàng</a> ' +
          '<a onclick="Inventory.showMinStock(\'' + i.product_id + '\')" class="btn-small grey waves-effect">Đặt min</a>' +
        '</td>' +
      '</tr>';
    }).join('');
    updateAdminUI();
  },

  showRestock: function(productId) {
    var item = state.inventory.find(function(i) { return i.product_id === productId; });
    if (!item) return;
    document.getElementById('restock-product-id').value = productId;
    document.getElementById('restock-product-name').textContent = item.product_name;
    document.getElementById('restock-quantity').value = '';
    M.updateTextFields();
    M.Modal.getInstance(document.getElementById('restock-modal')).open();
  },

  doRestock: function() {
    var productId = document.getElementById('restock-product-id').value;
    var qty = Number(document.getElementById('restock-quantity').value);
    if (!qty || qty <= 0) { showToast('Số lượng phải > 0', 'orange'); return; }

    api.call('apiRestock', productId, qty).then(function() {
      M.Modal.getInstance(document.getElementById('restock-modal')).close();
      showToast('Đã nhập hàng thành công', 'green');
      Inventory.loaded = false;
      Inventory.init();
    }).catch(function(e) {
      showToast('Lỗi: ' + e.message, 'red');
    });
  },

  showMinStock: function(productId) {
    var item = state.inventory.find(function(i) { return i.product_id === productId; });
    if (!item) return;
    document.getElementById('minstock-product-id').value = productId;
    document.getElementById('minstock-product-name').textContent = item.product_name;
    document.getElementById('minstock-value').value = item.min_stock;
    M.updateTextFields();
    M.Modal.getInstance(document.getElementById('minstock-modal')).open();
  },

  saveMinStock: function() {
    var productId = document.getElementById('minstock-product-id').value;
    var min = Number(document.getElementById('minstock-value').value);
    if (isNaN(min) || min < 0) { showToast('Mức tối thiểu phải >= 0', 'orange'); return; }

    api.call('apiSetMinStock', productId, min).then(function() {
      M.Modal.getInstance(document.getElementById('minstock-modal')).close();
      showToast('Đã lưu mức tối thiểu', 'green');
      Inventory.loaded = false;
      Inventory.init();
    }).catch(function(e) {
      showToast('Lỗi: ' + e.message, 'red');
    });
  }
};
</script>
